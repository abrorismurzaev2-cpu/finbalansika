name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate PNG icons
        run: |
          pip install pillow -q
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import os
          os.makedirs('assets/icons', exist_ok=True)
          for size, name in [(192, 'icon-192.png'), (512, 'icon-512.png'), (180, 'apple-touch-icon.png')]:
              img = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              draw = ImageDraw.Draw(img)
              m = int(size * 0.08)
              draw.rounded_rectangle([m, m, size-m, size-m], radius=int(size*0.22), fill=(28, 28, 30, 255))
              c = size // 2
              r = int(size * 0.18)
              draw.ellipse([c-r, c-r-int(size*0.05), c+r, c+r-int(size*0.05)], fill=(16, 185, 129, 255))
              bar_w = max(8, int(size * 0.06))
              for i, h in enumerate([0.25, 0.4, 0.55]):
                  x = c - int(size*0.18) + i * int(size*0.14)
                  y2 = c + int(size * 0.28)
                  y1 = y2 - int(size * h)
                  draw.rounded_rectangle([x, y1, x+bar_w, y2], radius=bar_w//2, fill=(255, 255, 255, 230))
              img.save(f'assets/icons/{name}')
          print('icons ready')
          PY
          mkdir -p www/assets/icons
          cp assets/icons/*.png www/assets/icons/ 2>/dev/null || true
          cp assets/icons/icon.svg www/assets/icons/ 2>/dev/null || true

      - name: Install deps
        run: npm install

      - name: Add Android platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Patch Android app id and name
        run: |
          if [ -f android/app/build.gradle ]; then
            sed -i 's/applicationId .*/applicationId "app.finbalansika.finance"/' android/app/build.gradle || true
            sed -i 's/namespace .*/namespace "app.finbalansika.finance"/' android/app/build.gradle || true
          fi
          if [ -f android/app/src/main/res/values/strings.xml ]; then
            sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">ФинБалансика<\/string>/' android/app/src/main/res/values/strings.xml || true
          fi

      - name: Decode keystore (optional)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          echo "storeFile=release.keystore" > android/keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/keystore.properties

      - name: Build release APK
        working-directory: android
        run: |
          if [ -f keystore.properties ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Find APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs -name "*.apk" | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "Found $APK"
          ls -la "$APK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: finbalansika-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: ФинБалансика APK v${{ github.run_number }}
          files: ${{ steps.apk.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
