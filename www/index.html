<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="ФинБалансика — умный учёт финансов">
  <title>ФинБалансика</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0b;
      --bg-elevated: #141416;
      --bg-card: #1a1a1e;
      --bg-soft: #222228;
      --bg-hover: #2a2a32;
      --text: #f4f4f5;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      --accent: #22c55e;
      --accent-soft: rgba(34, 197, 94, 0.15);
      --danger: #ef4444;
      --danger-soft: rgba(239, 68, 68, 0.15);
      --blue: #3b82f6;
      --blue-soft: rgba(59, 130, 246, 0.15);
      --purple: #a855f7;
      --border: rgba(255,255,255,0.06);
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
      --radius: 20px;
      --radius-sm: 14px;
      --radius-xs: 10px;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
      --nav-h: 72px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --spring: cubic-bezier(0.34, 1.4, 0.64, 1);
    }

    body.light {
      --bg: #f4f4f5;
      --bg-elevated: #ffffff;
      --bg-card: #ffffff;
      --bg-soft: #f0f0f2;
      --bg-hover: #e8e8ec;
      --text: #18181b;
      --text-secondary: #52525b;
      --text-muted: #a1a1aa;
      --border: rgba(0,0,0,0.06);
      --shadow: 0 4px 24px rgba(0,0,0,0.06);
      --accent-soft: rgba(34, 197, 94, 0.12);
      --danger-soft: rgba(239, 68, 68, 0.12);
      --blue-soft: rgba(59, 130, 246, 0.12);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      padding-bottom: calc(var(--nav-h) + var(--safe-b));
      transition: background 0.35s var(--ease), color 0.35s var(--ease);
    }

    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    input, select, textarea { font-family: inherit; color: inherit; }

    .app { max-width: 430px; margin: 0 auto; min-height: 100%; position: relative; }

    .screen {
      display: none;
      padding: 16px 16px 24px;
      padding-top: calc(12px + var(--safe-t));
      animation: screenIn 0.4s var(--ease) both;
    }
    .screen.active { display: block; }

    @keyframes screenIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: none; }
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .header h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.4px;
    }
    .header-actions { display: flex; gap: 8px; }

    .icon-btn {
      width: 40px; height: 40px;
      border-radius: 12px;
      background: var(--bg-soft);
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.2s var(--spring), background 0.2s;
    }
    .icon-btn:active { transform: scale(0.88); }
    .icon-btn svg { width: 18px; height: 18px; opacity: 0.85; }

    .balance-card {
      background: linear-gradient(145deg, #1c1c22 0%, #141418 100%);
      border-radius: 24px;
      padding: 24px 22px 20px;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    body.light .balance-card {
      background: linear-gradient(145deg, #ffffff 0%, #f8f8fa 100%);
    }
    .balance-card::before {
      content: '';
      position: absolute;
      top: -40%; right: -20%;
      width: 180px; height: 180px;
      background: radial-gradient(circle, rgba(34,197,94,0.18) 0%, transparent 70%);
      pointer-events: none;
    }
    .balance-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 6px;
      letter-spacing: 0.2px;
    }
    .balance-value {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -1.2px;
      line-height: 1.1;
      margin-bottom: 20px;
      transition: opacity 0.25s;
    }
    .balance-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .stat-pill {
      background: rgba(255,255,255,0.04);
      border-radius: 14px;
      padding: 12px 14px;
      border: 1px solid var(--border);
    }
    body.light .stat-pill { background: var(--bg-soft); }
    .stat-pill .label {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 4px;
    }
    .stat-pill .value {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .stat-pill.income .value { color: var(--accent); }
    .stat-pill.expense .value { color: var(--danger); }

    .quick-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 24px;
    }
    .qa-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 15px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 600;
      transition: transform 0.2s var(--spring), box-shadow 0.2s, background 0.2s;
    }
    .qa-btn:active { transform: scale(0.96); }
    .qa-income {
      background: var(--accent-soft);
      color: var(--accent);
    }
    .qa-expense {
      background: var(--danger-soft);
      color: var(--danger);
    }
    .qa-btn svg { width: 18px; height: 18px; }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .section-head h2 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .tx-list { display: flex; flex-direction: column; gap: 8px; }
    .tx-item {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--bg-card);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      border: 1px solid var(--border);
      transition: transform 0.2s var(--spring), background 0.2s;
      animation: itemIn 0.35s var(--ease) both;
    }
    .tx-item:active { transform: scale(0.98); background: var(--bg-hover); }
    @keyframes itemIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    .tx-icon {
      width: 42px; height: 42px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .tx-icon svg { width: 20px; height: 20px; }
    .tx-info { flex: 1; min-width: 0; }
    .tx-info .name {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tx-info .meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .tx-amount {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.3px;
      white-space: nowrap;
    }
    .tx-amount.income { color: var(--accent); }
    .tx-amount.expense { color: var(--danger); }

    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      max-width: 430px;
      margin: 0 auto;
      height: calc(var(--nav-h) + var(--safe-b));
      padding-bottom: var(--safe-b);
      background: var(--bg-elevated);
      border-top: 1px solid var(--border);
      display: flex;
      z-index: 100;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.2px;
      transition: color 0.25s;
      position: relative;
    }
    .nav-item svg {
      width: 22px; height: 22px;
      transition: transform 0.25s var(--spring);
    }
    .nav-item.active { color: var(--text); }
    .nav-item.active svg { transform: scale(1.08); }
    .nav-item .indicator {
      position: absolute;
      top: 6px;
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0;
      transform: scale(0);
      transition: all 0.3s var(--spring);
    }
    .nav-item.active .indicator {
      opacity: 1;
      transform: scale(1);
    }

    .period-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      background: var(--bg-soft);
      padding: 4px;
      border-radius: 14px;
    }
    .period-tab {
      flex: 1;
      padding: 9px 0;
      border-radius: 11px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      transition: all 0.25s var(--ease);
    }
    .period-tab.active {
      background: var(--bg-card);
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .an-total {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.8px;
      margin-bottom: 4px;
    }
    .an-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .chart-bars {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      height: 110px;
      margin-bottom: 24px;
      padding: 0 4px;
    }
    .bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      justify-content: flex-end;
    }
    .bar {
      width: 100%;
      max-width: 28px;
      border-radius: 6px 6px 3px 3px;
      background: linear-gradient(180deg, var(--blue) 0%, rgba(59,130,246,0.4) 100%);
      min-height: 4px;
      transition: height 0.5s var(--ease);
      animation: barGrow 0.6s var(--ease) both;
    }
    @keyframes barGrow {
      from { height: 0 !important; }
    }
    .bar-label {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 6px;
      font-weight: 500;
    }

    .cat-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      animation: itemIn 0.35s var(--ease) both;
    }
    .cat-row:last-child { border-bottom: none; }
    .cat-icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .cat-icon svg { width: 16px; height: 16px; }
    .cat-info { flex: 1; min-width: 0; }
    .cat-info .top {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .cat-bar-bg {
      height: 5px;
      background: var(--bg-soft);
      border-radius: 3px;
      overflow: hidden;
    }
    .cat-bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.6s var(--ease);
    }

    .goal-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      transition: transform 0.2s var(--spring);
      animation: itemIn 0.35s var(--ease) both;
    }
    .goal-card:active { transform: scale(0.98); }
    .goal-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .goal-title {
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .goal-icon-wrap {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: var(--blue-soft);
      display: flex; align-items: center; justify-content: center;
    }
    .goal-icon-wrap svg { width: 18px; height: 18px; color: var(--blue); }
    .goal-pct {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
    }
    .goal-progress {
      height: 8px;
      background: var(--bg-soft);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .goal-fill {
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--accent), #4ade80);
      transition: width 0.7s var(--ease);
    }
    .goal-meta {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .settings-group {
      background: var(--bg-card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      margin-bottom: 16px;
    }
    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      transition: background 0.2s;
    }
    .settings-row:last-child { border-bottom: none; }
    .settings-row:active { background: var(--bg-hover); }
    .settings-row .left {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 15px;
      font-weight: 500;
    }
    .settings-row .left svg { width: 20px; height: 20px; opacity: 0.7; }

    .toggle {
      width: 48px; height: 28px;
      border-radius: 14px;
      background: var(--bg-soft);
      position: relative;
      transition: background 0.25s;
      flex-shrink: 0;
    }
    .toggle.on { background: var(--accent); }
    .toggle::after {
      content: '';
      position: absolute;
      width: 22px; height: 22px;
      border-radius: 50%;
      background: #fff;
      top: 3px; left: 3px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      transition: transform 0.25s var(--spring);
    }
    .toggle.on::after { transform: translateX(20px); }

    .btn-block {
      width: 100%;
      padding: 15px;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      transition: transform 0.2s var(--spring), opacity 0.2s;
      margin-bottom: 10px;
    }
    .btn-block:active { transform: scale(0.97); }
    .btn-secondary {
      background: var(--bg-soft);
      color: var(--text);
    }
    .btn-danger {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 200;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s, visibility 0.3s;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    .overlay.open {
      opacity: 1;
      visibility: visible;
    }
    .modal {
      width: 100%;
      max-width: 430px;
      background: var(--bg-elevated);
      border-radius: 24px 24px 0 0;
      padding: 12px 20px calc(24px + var(--safe-b));
      max-height: 88vh;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.4s var(--ease);
      border: 1px solid var(--border);
      border-bottom: none;
    }
    .overlay.open .modal { transform: translateY(0); }
    .modal-handle {
      width: 36px; height: 4px;
      background: var(--text-muted);
      border-radius: 2px;
      margin: 0 auto 16px;
      opacity: 0.4;
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .modal-head h3 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .modal-close {
      width: 32px; height: 32px;
      border-radius: 10px;
      background: var(--bg-soft);
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.2s;
    }
    .modal-close:active { transform: scale(0.9); }
    .modal-close svg { width: 16px; height: 16px; }

    .type-switch {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
      background: var(--bg-soft);
      padding: 4px;
      border-radius: 12px;
    }
    .type-btn {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      transition: all 0.25s;
    }
    .type-btn.active {
      background: var(--bg-card);
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }

    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      letter-spacing: 0.2px;
      text-transform: uppercase;
    }
    .field input, .field select {
      width: 100%;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg-soft);
      font-size: 15px;
      font-weight: 500;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field input:focus, .field select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px var(--blue-soft);
    }

    .btn-primary {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      background: var(--text);
      color: var(--bg);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.2px;
      transition: transform 0.2s var(--spring), opacity 0.2s;
      margin-top: 8px;
    }
    .btn-primary:active { transform: scale(0.97); opacity: 0.9; }
    body.light .btn-primary {
      background: var(--text);
      color: #fff;
    }

    .empty {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-muted);
    }
    .empty-icon {
      width: 56px; height: 56px;
      border-radius: 16px;
      background: var(--bg-soft);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
    }
    .empty-icon svg { width: 24px; height: 24px; opacity: 0.5; }
    .empty p { font-size: 14px; font-weight: 500; }

    .toast {
      position: fixed;
      bottom: calc(var(--nav-h) + var(--safe-b) + 16px);
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--text);
      color: var(--bg);
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: all 0.35s var(--ease);
      z-index: 400;
      white-space: nowrap;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    body.light .toast {
      background: #18181b;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="app">
    <div id="screen-home" class="screen active">
      <div class="header">
        <h1>ФинБалансика</h1>
        <div class="header-actions">
          <button class="icon-btn" id="privacyBtn" title="Приватность" aria-label="Приватность">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
          <button class="icon-btn" id="themeBtn" title="Тема" aria-label="Тема">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
        </div>
      </div>

      <div class="balance-card">
        <div class="balance-label">Баланс за месяц</div>
        <div class="balance-value" id="balanceValue">0 ₽</div>
        <div class="balance-row">
          <div class="stat-pill income">
            <div class="label">Доходы</div>
            <div class="value" id="incomeValue">0 ₽</div>
          </div>
          <div class="stat-pill expense">
            <div class="label">Расходы</div>
            <div class="value" id="expenseValue">0 ₽</div>
          </div>
        </div>
      </div>

      <div class="quick-row">
        <button class="qa-btn qa-income" id="quickIncome">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
          Доход
        </button>
        <button class="qa-btn qa-expense" id="quickExpense">

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>

  <div class="overlay" id="goalModal">
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-head">
        <h3 id="goalModalTitle">Новая цель</h3>
        <button class="modal-close" id="goalModalClose">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>

        <input type="text" id="goalTitle" placeholder="Например: Отпуск">

        <input type="number" id="goalTarget" placeholder="100000">
      </div>
      <div class="field">
        <label>Уже накоплено, ₽</label>
        <input type="number" id="goalCurrent" placeholder="0" value="0">
      </div>
      <button class="btn-primary" id="goalSaveBtn">Сохранить</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
  (function(){
    'use strict';
    const STORAGE = 'finbalansika_v2';
    const CATS = {
      expense: [
        {id:'food', name:'Еда', color:'#f97316'},
        {id:'transport', name:'Транспорт', color:'#3b82f6'},
        {id:'home', name:'Дом', color:'#8b5cf6'},
        {id:'shop', name:'Покупки', color:'#ec4899'},
        {id:'health', name:'Здоровье', color:'#10b981'},
        {id:'fun', name:'Развлечения', color:'#eab308'},
        {id:'edu', name:'Образование', color:'#06b6d4'},
        {id:'other_e', name:'Другое', color:'#71717a'},
      ],
      income: [
        {id:'salary', name:'Зарплата', color:'#22c55e'},
        {id:'freelance', name:'Фриланс', color:'#3b82f6'},
        {id:'gift', name:'Подарок', color:'#a855f7'},
        {id:'invest', name:'Инвестиции', color:'#14b8a6'},
        {id:'other_i', name:'Другое', color:'#71717a'},
      ]
    };

    const ICONS = {
      food: '<path d="M18 8h1a4 4 0 0 1 0 8h-1M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/>',
      transport: '<rect x="1" y="3" width="15" height="13" rx="2"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>',
      home: '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
      shop: '<path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/>',
      health: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
      fun: '<circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/>',
      edu: '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
      other_e: '<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
      salary: '<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',
      freelance: '<rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>',
      gift: '<polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>',
      invest: '<polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>',
      other_i: '<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
      goal: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
      empty: '<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>'
    };

    function svgIcon(key, size) {
      const d = ICONS[key] || ICONS.other_e;
      return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="${size||20}" height="${size||20}">${d}</svg>`;
    }

    const state = {
      transactions: [],
      goals: [],
      dark: true,
      privacy: false,
      period: 'month',
      txType: 'expense',
      editTxId: null,
      editGoalId: null
    };

    function load() {
      try {
        const raw = localStorage.getItem(STORAGE);
        if (!raw) return;
        const d = JSON.parse(raw);
        state.transactions = Array.isArray(d.transactions) ? d.transactions : [];
        state.goals = Array.isArray(d.goals) ? d.goals : [];
        state.dark = d.dark !== false;
        state.privacy = !!d.privacy;
      } catch(e) {}
    }

    function save() {
      try {
        localStorage.setItem(STORAGE, JSON.stringify({
          transactions: state.transactions,
          goals: state.goals,
          dark: state.dark,
          privacy: state.privacy
        }));
      } catch(e) { toast('Ошибка сохранения'); }
    }

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
    }

    function fmt(n, hide) {
      if (hide && state.privacy) return '••••';
      return (Number(n)||0).toLocaleString('ru-RU', {maximumFractionDigits:0});
    }

    function money(n, hide) {
      return fmt(n, hide) + (hide && state.privacy ? '' : ' ₽');
    }

    function today() {
      return new Date().toISOString().slice(0,10);
    }

    function startOf(period) {
      const now = new Date();
      const d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      if (period === 'week') {
        const day = (d.getDay() + 6) % 7;
        d.setDate(d.getDate() - day);
      } else if (period === 'month') d.setDate(1);
      else if (period === 'year') d.setMonth(0,1);
      return d;
    }

    function inPeriod(iso, period) {
      if (!iso) return false;
      return new Date(iso + 'T00:00:00') >= startOf(period);
    }

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('show'), 2200);
    }

    function applyTheme() {
      document.body.classList.toggle('light', !state.dark);
      document.getElementById('themeToggle').classList.toggle('on', state.dark);
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.content = state.dark ? '#0a0a0b' : '#f4f4f5';
    }

    function applyPrivacy() {
      document.getElementById('privacyToggle').classList.toggle('on', state.privacy);
      renderHome();
      renderAnalytics();
      renderGoals();
    }

    function catById(id) {
      for (const t of ['expense','income']) {
        const f = CATS[t].find(c => c.id === id);
        if (f) return f;
      }
      return {id, name: id, color: '#71717a'};
    }

    function fillCats() {
      const sel = document.getElementById('txCategory');
      const list = CATS[state.txType] || CATS.expense;
      sel.innerHTML = list.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
    }

    function calcMonth() {
      let income = 0, expense = 0;
      state.transactions.forEach(tx => {
        if (!inPeriod(tx.date, 'month')) return;
        if (tx.type === 'income') income += Number(tx.amount)||0;
        else expense += Number(tx.amount)||0;
      });
      return {income, expense, balance: income - expense};
    }

    function renderHome() {
      const {income, expense, balance} = calcMonth();
      document.getElementById('balanceValue').textContent = money(balance, true);
      document.getElementById('incomeValue').textContent = money(income, true);
      document.getElementById('expenseValue').textContent = money(expense, true);

      const list = document.getElementById('txList');
      const recent = [...state.transactions]
        .sort((a,b) => (b.date||'').localeCompare(a.date||''))
        .slice(0, 10);

      if (!recent.length) {
        list.innerHTML = `<div class="empty"><div class="empty-icon">${svgIcon('empty')}</div><p>Пока нет операций</p></div>`;
        return;
      }

      list.innerHTML = recent.map((tx, i) => {
        const cat = catById(tx.category);
        const sign = tx.type === 'income' ? '+' : '−';
        return `<div class="tx-item" data-id="${tx.id}" style="animation-delay:${i*0.04}s">
          <div class="tx-icon" style="background:${cat.color}22;color:${cat.color}">${svgIcon(tx.category)}</div>
          <div class="tx-info">
            <div class="name">${cat.name}${tx.note ? ' · ' + tx.note : ''}</div>
            <div class="meta">${tx.date || ''}</div>
          </div>
          <div class="tx-amount ${tx.type}">${sign}${money(tx.amount, true)}</div>
        </div>`;
      }).join('');
    }

    function renderAnalytics() {
      const period = state.period;
      const txs = state.transactions.filter(tx => inPeriod(tx.date, period) && tx.type === 'expense');
      const total = txs.reduce((s,t) => s + (Number(t.amount)||0), 0);
      document.getElementById('anExpenseTotal').textContent = money(total, true);

      const groups = {};
      txs.forEach(tx => {
        const key = (tx.date||'').slice(5) || '??';
        groups[key] = (groups[key]||0) + (Number(tx.amount)||0);
      });
      const entries = Object.entries(groups).sort((a,b)=>a[0].localeCompare(b[0])).slice(-7);
      const max = Math.max(...entries.map(e=>e[1]), 1);
      const bars = document.getElementById('chartBars');
      if (!entries.length) {
        bars.innerHTML = `<div class="empty" style="width:100%;padding:20px 0"><p>Нет данных</p></div>`;
      } else {
        bars.innerHTML = entries.map(([k,v],i) => {
          const h = Math.max(4, Math.round((v/max)*100));
          return `<div class="bar-col">
            <div class="bar" style="height:${h}%;animation-delay:${i*0.05}s"></div>
            <div class="bar-label">${k.slice(-2)}</div>
          </div>`;
        }).join('');
      }

      const byCat = {};
      txs.forEach(tx => { byCat[tx.category] = (byCat[tx.category]||0) + (Number(tx.amount)||0); });
      const catEntries = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
      const catList = document.getElementById('catList');
      if (!catEntries.length) {
        catList.innerHTML = `<div class="empty"><p>Нет расходов за период</p></div>`;
        return;
      }
      catList.innerHTML = catEntries.map(([id,sum],i) => {
        const cat = catById(id);
        const pct = total ? Math.round((sum/total)*100) : 0;
        return `<div class="cat-row" style="animation-delay:${i*0.04}s">
          <div class="cat-icon" style="background:${cat.color}22;color:${cat.color}">${svgIcon(id,16)}</div>
          <div class="cat-info">
            <div class="top"><span>${cat.name}</span><span>${money(sum,true)}</span></div>
            <div class="cat-bar-bg"><div class="cat-bar-fill" style="width:${pct}%;background:${cat.color}"></div></div>
          </div>
        </div>`;
      }).join('');
    }

    function renderGoals() {
      const list = document.getElementById('goalsList');
      if (!state.goals.length) {
        list.innerHTML = `<div class="empty"><div class="empty-icon">${svgIcon('goal')}</div><p>Добавьте первую цель</p></div>`;
        return;
      }
      list.innerHTML = state.goals.map((g,i) => {
        const pct = Math.min(100, Math.round(((Number(g.current)||0)/(Number(g.target)||1))*100));
        return `<div class="goal-card" data-id="${g.id}" style="animation-delay:${i*0.05}s">
          <div class="goal-top">
            <div class="goal-title">
              <div class="goal-icon-wrap">${svgIcon('goal')}</div>
              ${g.title}
            </div>
            <div class="goal-pct">${pct}%</div>
          </div>
          <div class="goal-progress"><div class="goal-fill" style="width:${pct}%"></div></div>
          <div class="goal-meta">
            <span>${money(g.current, true)}</span>
            <span>из ${money(g.target, true)}</span>
          </div>
        </div>`;
      }).join('');
    }

    function openTx(type, editId) {
      state.txType = type || 'expense';
      state.editTxId = editId || null;
      document.getElementById('txModalTitle').textContent = editId ? 'Редактировать' : 'Новая операция';
      document.querySelectorAll('.type-btn').forEach(b => b.classList.toggle('active', b.dataset.type === state.txType));
      fillCats();
      document.getElementById('txAmount').value = '';
      document.getElementById('txNote').value = '';
      document.getElementById('txDate').value = today();
      if (editId) {
        const tx = state.transactions.find(t => t.id === editId);
        if (tx) {
          state.txType = tx.type;
          document.querySelectorAll('.type-btn').forEach(b => b.classList.toggle('active', b.dataset.type === tx.type));
          fillCats();
          document.getElementById('txAmount').value = tx.amount;
          document.getElementById('txCategory').value = tx.category;
          document.getElementById('txNote').value = tx.note || '';
          document.getElementById('txDate').value = tx.date || today();
        }
      }
      document.getElementById('txModal').classList.add('open');
    }

    function openGoal(editId) {
      state.editGoalId = editId || null;
      document.getElementById('goalModalTitle').textContent = editId ? 'Редактировать цель' : 'Новая цель';
      document.getElementById('goalTitle').value = '';
      document.getElementById('goalTarget').value = '';
      document.getElementById('goalCurrent').value = '0';
      if (editId) {
        const g = state.goals.find(x => x.id === editId);
        if (g) {
          document.getElementById('goalTitle').value = g.title || '';
          document.getElementById('goalTarget').value = g.target || '';
          document.getElementById('goalCurrent').value = g.current || 0;
        }
      }
      document.getElementById('goalModal').classList.add('open');
    }

    function bind() {
      document.querySelectorAll('.nav-item').forEach(btn => {
        btn.addEventListener('click', () => {
          const s = btn.dataset.screen;
          document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          document.querySelectorAll('.screen').forEach(sc => sc.classList.remove('active'));
          const el = document.getElementById('screen-' + s);
          el.classList.add('active');
          void el.offsetWidth;
          if (s === 'analytics') renderAnalytics();
          if (s === 'goals') renderGoals();
        });
      });

      document.getElementById('quickIncome').onclick = () => openTx('income');
      document.getElementById('quickExpense').onclick = () => openTx('expense');
      document.getElementById('txModalClose').onclick = () => document.getElementById('txModal').classList.remove('open');
      document.getElementById('goalModalClose').onclick = () => document.getElementById('goalModal').classList.remove('open');
      document.getElementById('addGoalBtn').onclick = () => openGoal();

      document.querySelectorAll('.type-btn').forEach(btn => {
        btn.onclick = () => {
          state.txType = btn.dataset.type;
          document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          fillCats();
        };
      });

      document.getElementById('txSaveBtn').onclick = () => {
        const amount = parseFloat(document.getElementById('txAmount').value);
        if (!amount || amount <= 0) { toast('Введите сумму'); return; }
        const category = document.getElementById('txCategory').value;
        const note = document.getElementById('txNote').value.trim();
        const date = document.getElementById('txDate').value || today();
        if (state.editTxId) {
          const tx = state.transactions.find(t => t.id === state.editTxId);
          if (tx) {
            tx.amount = amount; tx.category = category; tx.note = note; tx.date = date; tx.type = state.txType;
          }
        } else {
          state.transactions.push({id: uid(), type: state.txType, amount, category, note, date});
        }
        save();
        document.getElementById('txModal').classList.remove('open');
        renderHome();
        renderAnalytics();
        toast('Сохранено');
      };

      document.getElementById('goalSaveBtn').onclick = () => {
        const title = document.getElementById('goalTitle').value.trim();
        const target = parseFloat(document.getElementById('goalTarget').value);
        const current = parseFloat(document.getElementById('goalCurrent').value) || 0;
        if (!title || !target) { toast('Заполните название и цель'); return; }
        if (state.editGoalId) {
          const g = state.goals.find(x => x.id === state.editGoalId);
          if (g) { g.title = title; g.target = target; g.current = current; }
        } else {
          state.goals.push({id: uid(), title, target, current});
        }
        save();
        document.getElementById('goalModal').classList.remove('open');
        renderGoals();
        toast('Цель сохранена');
      };

      document.getElementById('themeBtn').onclick = () => {
        state.dark = !state.dark;
        save();
        applyTheme();
      };
      document.getElementById('themeToggle').onclick = () => {
        state.dark = !state.dark;
        save();
        applyTheme();
      };
      document.getElementById('privacyBtn').onclick = () => {
        state.privacy = !state.privacy;
        save();
        applyPrivacy();
      };
      document.getElementById('privacyToggle').onclick = () => {
        state.privacy = !state.privacy;
        save();
        applyPrivacy();
      };

      document.querySelectorAll('.period-tab').forEach(tab => {
        tab.onclick = () => {
          state.period = tab.dataset.period;
          document.querySelectorAll('.period-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          renderAnalytics();
        };
      });

      document.getElementById('exportBtn').onclick = () => {
        const blob = new Blob([JSON.stringify({
          transactions: state.transactions,
          goals: state.goals,
          exportedAt: new Date().toISOString()
        }, null, 2)], {type:'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'finbalansika-export.json';
        a.click();
        URL.revokeObjectURL(a.href);
        toast('Экспорт готов');
      };

      document.getElementById('clearDataBtn').onclick = () => {
        if (!confirm('Удалить все операции и цели?')) return;
        state.transactions = [];
        state.goals = [];
        save();
        renderHome();
        renderGoals();
        renderAnalytics();
        toast('Данные очищены');
      };

      document.getElementById('txList').onclick = e => {
        const item = e.target.closest('.tx-item');
        if (item) openTx(null, item.dataset.id);
      };
      document.getElementById('goalsList').onclick = e => {
        const card = e.target.closest('.goal-card');
        if (card) openGoal(card.dataset.id);
      };

      document.getElementById('txModal').onclick = e => {
        if (e.target.id === 'txModal') e.target.classList.remove('open');
      };
      document.getElementById('goalModal').onclick = e => {
        if (e.target.id === 'goalModal') e.target.classList.remove('open');
      };
    }

    function seed() {
      if (state.transactions.length) return;
      const d = today();
      state.transactions = [
        {id:uid(), type:'income', amount:85000, category:'salary', note:'Зарплата', date:d},
        {id:uid(), type:'expense', amount:2400, category:'food', note:'Продукты', date:d},
        {id:uid(), type:'expense', amount:890, category:'transport', note:'', date:d},
        {id:uid(), type:'expense', amount:3500, category:'shop', note:'Одежда', date:d},
      ];
      state.goals = [
        {id:uid(), title:'Отпуск', target:180000, current:45000},
        {id:uid(), title:'Новый ноутбук', target:120000, current:28000},
      ];
      save();
    }

    load();
    seed();
    applyTheme();
    applyPrivacy();
    bind();
    fillCats();
    renderHome();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
    }
  })();
  </script>
</body>
</html>
